[package]
name = "teabot_desktop"
version = "0.1.0"
description = "TeaBot desktop control center for MaiBot and NapCat"
authors = ["teacat"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "teabot_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.6", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.10.3", features = [] }
tauri-plugin-log = "2"
base64 = "0.22"
reqwest = { version = "0.12", features = ["json", "multipart", "rustls-tls"] }
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading"] }
tokio = { version = "1", features = ["time"] }
